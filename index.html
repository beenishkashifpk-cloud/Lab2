<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2: Semantic Page</title>
</head>
<body>
  <header>
    <h1>My Semantic Page</h1>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#articles">Articles</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>
 
  <main>
    <section id="about">
      <h2>About</h2>
      <p>A short introduction goes here.</p>
    </section>
 
    <section id="articles">
      <h2>Articles</h2>
      <article>
        <h3>Article Title</h3>
        <p>Article content goes here.</p>
      </article>
    </section>
 
    <aside>
      <h2>Related Links</h2>
      <p>Sidebar content goes here.</p>
    </aside>
  </main>
 
  <footer id="contact">
    <p>&copy; 2026 Your Name. Contact: you@example.com</p>
  </footer>
 
  <script src="script.js"></script>
</body>
</html>
